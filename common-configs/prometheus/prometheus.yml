global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: individuals-api-metrics
    static_configs:
      - targets: ['individuals-api:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: person-service-metrics
    static_configs:
      - targets: ['person-service:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: wallet-service-metrics
    static_configs:
      - targets: [ 'wallet-service:8083' ]
    metrics_path: '/actuator/prometheus'

  - job_name: transaction-service-metrics
    static_configs:
      - targets: [ 'transaction-service:8084' ]
    metrics_path: '/actuator/prometheus'

  - job_name: currency-rate-service-metrics
    static_configs:
      - targets: [ 'currency-rate-service:8085' ]
    metrics_path: '/actuator/prometheus'

  - job_name: payment-provider-service-metrics
    static_configs:
      - targets: [ 'payment-provider-service:8086' ]
    metrics_path: '/actuator/prometheus'