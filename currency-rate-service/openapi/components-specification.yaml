openapi: 3.1.0

info:
  title: currency-rate-service-api-specification
  description: Common currency-rate-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8085
  - url: http://currency-rate-service:8085

paths:
  /rate:
    get:
      security:
        - BearerAuth: []
      tags:
        - Rates
      summary: Получить курс между двумя валютами на указанную дату/время
      operationId: getRate
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "USD"
          description: Код исходной валюты (например, "USD")
        - name: to
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "EUR"
          description: Код целевой валюты (например, "EUR")
        - name: provider
          in: query
          required: false
          schema:
            type: string
          description: Идентификатор конкретного поставщика данных. Если параметр опущен, возвращается смешанное (усредненное) значение по всем доступным провайдерам.
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Идентификатор трассировки запроса.
      responses:
        '200':
          description: Курс найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '404':
          description: Курс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /currencies:
    get:
      security:
        - BearerAuth: []
      tags:
        - Rates
      summary: Получить список поддерживаемых валют
      operationId: getCurrencies
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Идентификатор трассировки запроса open telemetry.
      responses:
        '200':
          description: Список валют
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyResponse'

  /rate-providers:
    get:
      security:
        - BearerAuth: []
      tags:
        - Rates
      summary: Получить список провайдеров курсов валют
      operationId: getRateProviders
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Идентификатор трассировки запроса.
      responses:
        '200':
          description: Провайдеры
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateProviderResponse'

  /currency:
    get:
      security:
        - BearerAuth: []
      tags:
        - Rates
      summary: Получить информацию по указанной валюте
      operationId: getCurrencyInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Трехбуквенный код валюты
          example: USD
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Идентификатор трассировки запроса
      responses:
        '200':
          description: Информация по валюте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'

        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /rate-provider:
    get:
      security:
        - BearerAuth: []
      tags:
        - Rates
      summary: Получить информацию по указанному поставщику курсов валют
      operationId: getRateProviderInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Код поставщика валют
          example: AMCM
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Идентификатор трассировки запроса
      responses:
        '200':
          description: Информация по поставщику валют
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateProviderResponse'

        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

tags:
  - name: Rates
    description: Describes operations with rates
  - name: Health
    description: Describes application's health status

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorDTO:
      type: object
      required: [ http_status, message ]
      properties:
        http_status:
          type: integer
          format: int32
        message:
          type: string

    RateResponse:
      type: object
      properties:
        sourceCode:
          type: string
          description: Код исходной валюты (например, "USD")
        destinationCode:
          type: string
          description: Код целевой валюты (например, "EUR")
        rate:
          type: number
          description: Курс обмена sourceCode→destinationCode
        rateDate:
          type: string
          description: Время, на которое действует курс
        providerCode:
          type: string
          description: Код провайдера курса

    CurrencyResponse:
      type: object
      properties:
        code:
          type: string
          description: Трёхбуквенный код валюты (ISO 4217)
        isoCode:
          type: integer
          description: Числовой ISO-код валюты
        description:
          type: string
        active:
          type: boolean
        symbol:
          type: string
          description: Символ валюты (например, $ или €)

    RateProviderResponse:
      type: object
      properties:
        providerCode:
          type: string
        providerName:
          type: string
        description:
          type: string
        date:
          type: string
        active:
          type: boolean

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP