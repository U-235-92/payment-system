logging:
  level:
    root: info
    aq.project.service: debug
    aq.project.mappers.rate: debug
    org.hibernate.orm.results: info
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql: info
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/payment-system
          jwk-set-uri: http://localhost:8080/realms/payment-system/protocol/openid-connect/certs
  flyway:
    enabled: false
  datasource:
    username: root
    password:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:currency_rate_service_test_db;INIT=RUNSCRIPT FROM 'classpath:schema-dev.sql'
  jpa:
    show-sql: false
    generate-ddl: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true