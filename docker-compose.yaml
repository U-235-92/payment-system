version: '3.8'
services:
  individuals-api:
    container_name: individuals-api
    build:
      context: .
      dockerfile: ./individuals-api/Dockerfile
    image: u23592/individuals-api:1.0.0
    env_file:
      - ./individuals-api/.env
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: container=individuals-api
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  person-service:
    container_name: person-service
    build:
      context: .
      dockerfile: ./person-service/Dockerfile
    image: u23592/person-service:1.0.0
    env_file:
      - ./person-service/.env
    ports:
      - "8082:8082"
    networks:
      - app-network
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: container=person-service
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  wallet-service:
    container_name: wallet-service
    build:
      context: .
      dockerfile: ./wallet-service/Dockerfile
    image: u23592/wallet-service:1.0.0
    env_file:
      - ./wallet-service/.env
    ports:
      - "8083:8083"
    networks:
      - app-network
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      wallet-service-db-shard-0:
        condition: service_healthy
      wallet-service-db-shard-1:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: container=wallet-service
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  transaction-service:
    container_name: transaction-service
    build:
      context: .
      dockerfile: ./transaction-service/Dockerfile
    image: u23592/transaction-service:1.0.0
    env_file:
      - ./transaction-service/.env
    ports:
      - "8084:8084"
    networks:
      - app-network
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: container=transaction-service
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  currency-rate-service:
    container_name: currency-rate-service
    build:
      context: .
      dockerfile: ./currency-rate-service/Dockerfile
    image: u23592/currency-rate-service:1.0.0
    env_file:
      - ./currency-rate-service/.env
    ports:
      - "8085:8085"
    networks:
      - app-network
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      currency-rate-service-db:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: container=currency-rate-service

  keycloak-db:
    image: postgres:18.3
    container_name: keycloak_db
    ports:
      - "5435:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: keycloak_db
      PGDATA: /var/lib/postgresql/17/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d keycloak_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wallet-service-db-shard-0:
    image: postgres:18.3
    container_name: wallet_service_db_shard_0
    ports:
      - "5445:5432"
    networks:
      - app-network
    volumes:
      - wallet_service_shard_0_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wallets_db
      PGDATA: /var/lib/postgresql/17/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d wallets_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wallet-service-db-shard-1:
    image: postgres:18.3
    container_name: wallet_service_db_shard_1
    ports:
      - "5455:5432"
    networks:
      - app-network
    volumes:
      - wallet_service_shard_1_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wallets_db
      PGDATA: /var/lib/postgresql/17/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d wallets_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  currency-rate-service-db:
    image: postgres:18.3
    container_name: currency-rate-service-db
    ports:
      - "5465:5432"
    networks:
      - app-network
    volumes:
      - currency_rate_service_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: currency_rate_service_db
      PGDATA: /var/lib/postgresql/17/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d currency_rate_service_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    container_name: keycloak
    ports:
      - "8080:8080"
    networks:
      - app-network
    command:
      - "start-dev"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
#      KC_LOG_LEVEL: DEBUG
    depends_on:
      keycloak-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    volumes:
      - ./common-configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - app-network
    command: -config.file=/etc/loki/local-config.yaml
#    volumes:
#      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    container_name: grafana
    image: grafana/grafana:12.4.2
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      prometheus:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector:0.118.0
    container_name: otel_collector
    command: --config=/etc/otelcol/config.yaml
    volumes:
      - ./common-configs/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
    networks:
      - app-network

  zipkin:
    image: openzipkin/zipkin:3.4.0
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - app-network

  kafka-controller-1:
    image: apache/kafka:4.0.2
    container_name: kafka_controller_1
    networks:
      - app-network
    volumes:
      - kafka_controller_1_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-controller-2:
    image: apache/kafka:4.0.2
    container_name: kafka_controller_2
    networks:
      - app-network
    volumes:
      - kafka_controller_2_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-controller-3:
    image: apache/kafka:4.0.2
    container_name: kafka_controller_3
    networks:
      - app-network
    volumes:
      - kafka_controller_3_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-broker-1:
    image: apache/kafka:4.0.2
    container_name: kafka_broker_1
    networks:
      - app-network
    ports:
      - 29092:9092
    volumes:
      - kafka_broker_1_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

  kafka-broker-2:
    image: apache/kafka:4.0.2
    container_name: kafka_broker_2
    networks:
      - app-network
    ports:
      - 39092:9092
    volumes:
      - kafka_broker_2_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

  kafka-broker-3:
    image: apache/kafka:4.0.2
    container_name: kafka_broker_3
    networks:
      - app-network
    ports:
      - 49092:9092
    volumes:
      - kafka_broker_3_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  wallet_service_shard_0_data:
    driver: local
  wallet_service_shard_1_data:
    driver: local
  keycloak:
    driver: local
  kafka_controller_1_data:
    driver: local
  kafka_controller_2_data:
    driver: local
  kafka_controller_3_data:
    driver: local
  kafka_broker_1_data:
    driver: local
  kafka_broker_2_data:
    driver: local
  kafka_broker_3_data:
    driver: local
  currency_rate_service_data:
    driver: local