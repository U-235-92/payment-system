logging:
  level:
    root: info
    sql: warn
    web: warn
    org.springframework.security: warn
    org.apache.shardingsphere: info

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

spring:
  flyway:
    enabled: false

  datasource:
    username: root
    password:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:fake_payment_provider_service_test_db

  jpa:
    show-sql: false
    generate-ddl: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true