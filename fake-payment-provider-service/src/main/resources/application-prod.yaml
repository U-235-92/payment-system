server:
  port: ${SERVICE_PORT}

logging:
  level:
    root: info
    org.hibernate.orm.results: info
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql: info

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URI}

spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI}
            token-uri: ${OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI}
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET}
            admin-id: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_ADMIN_ID}
            admin-secret: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_ADMIN_SECRET}

  flyway:
    driver-class-name:
    default-schema: public
    baseline-version: ${FLYWAY_DB_BASELINE_VERSION}
    baseline-on-migrate: true
    create-schemas: true
    locations: ${FLYWAY_MIGRATION_SCRIPT_PATH}
    clean-disabled: false

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  jpa:
    show-sql: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

app:
  service:
    webhook-service:
      uri: ${WEBHOOK_SERVICE_BASE_URI}
  security:
    access-token-key: ${ACCESS_TOKEN_KEY}
    access-token-hash-alg: ${ACCESS_TOKEN_HASH_ALG}