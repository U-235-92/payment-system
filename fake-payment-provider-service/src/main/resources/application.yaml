logging:
  level:
    root: info

server:
  port: 8086

spring:
  application:
    name: fake-payment-provider-service

  profiles:
    active:
      - dev

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/payment-system
            token-uri: http://localhost:8080/realms/payment-system/protocol/openid-connect/token
        registration:
          keycloak:
            client-id: fake-payment-provider-service
            client-secret: CHANGE_ME!!!!!
            admin-id: payment-system-admin-cli
            admin-secret: RGybolPwVl7FMtZDyZCn6owhkY3ewtam

management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: fake-payment-provider-service
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health

resilience4j:
  retry:
    instances:
      fail-payment-retry:
        max-attempts: 3
        wait-duration: 500
        fail-after-max-attempts: true
        exponential-backoff-multiplier: 1.5

      update-operation-status-retry:
        max-attempts: 3
        wait-duration: 500
        fail-after-max-attempts: true
        exponential-backoff-multiplier: 1.5

  ratelimiter:
    instances:
      create-transaction-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-transaction-list-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-transaction-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      create-payout-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-payout-list-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-payout-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

app:
  schedule:
    update-operation-status: 30
    update-payout-status: 5
    update-transaction-status: 5

  security:
    access-token-key: fake_key
    access-token-hash-alg: SHA-256

  service:
    webhook-service:
      uri: http://localhost:8088