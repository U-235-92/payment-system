openapi: 3.1.0

info:
  title: Common DTO specifications
  description: Спецификация DTO
  version: 1.0.0

servers:
  - url: http://localhost:8081

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserInfoResponseDTO:
      type: object
      required: [ keycloak_user_id, email, roles, created, individual_data ]
      properties:
        keycloak_user_id:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        individual_data:
          $ref: "#/components/schemas/IndividualDataResponseDTO"

    IndividualDataResponseDTO:
      type: object
      required: [ first_name, last_name, email, phone_number, passport_number, address ]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        address:
          $ref: "#/components/schemas/AddressDTO"

    AddressDTO:
      type: object
      required: [ country, state, city, address, zip_code ]
      properties:
        country:
          $ref: "#/components/schemas/CountryDTO"
        state:
          type: string
        city:
          type: string
        address:
          type: string
        zip_code:
          type: string

    CountryDTO:
      type: object
      required: [ name, code ]
      properties:
        name:
          type: string
        code:
          type: string

    CreateUserDTO:
      type: object
      required: [ username, password, confirm_password, individual_data ]
      properties:
        keycloak_user_id:
          type: string
        username:
          type: string
        password:
          type: string
        confirm_password:
          type: string
        individual_data:
          $ref: "#/components/schemas/CreateIndividualDataDTO"

    CreateIndividualDataDTO:
      type: object
      required: [ first_name, last_name, email, phone_number, passport_number, address ]
      properties:
        keycloak_user_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        active:
          type: boolean
          default: true
        address:
          $ref: "#/components/schemas/AddressDTO"

    UpdateUserDTO:
      type: object
      required: [ keycloak_user_id, password, confirm_password, individual_data ]
      properties:
        keycloak_user_id:
          type: string
        password:
          type: string
        confirm_password:
          type: string
        individual_data:
          $ref: "#/components/schemas/UpdateIndividualDataDTO"

    UpdateIndividualDataDTO:
      type: object
      required: [ keycloak_user_id, first_name, last_name, phone_number, passport_number, address ]
      properties:
        keycloak_user_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        active:
          type: boolean
          default: true
        address:
          $ref: "#/components/schemas/AddressDTO"

    LoginUserDTO:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenDTO:
      type: object
      required: [ refresh_token ]
      properties:
        refresh_token:
          type: string

    ResponseTokenDTO:
      type: object
      required: [ keycloak_user_id, access_token, refresh_token, expires_in, token_type ]
      properties:
        keycloak_user_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: long
        token_type:
          type: string
          example: Bearer [token]

    UndoOperationDTO:
      type: object
      required: [ operation, payload ]
      properties:
        id:
          type: string
        operation:
          enum:
            - undo_update_person
            - undo_delete_person
        payload:
          type: object
          additionalProperties:
            type: string

    ErrorDTO:
      type: object
      required: [ http_status, message ]
      properties:
        http_status:
          type: int
        message:
          type: string

    CreateWalletRequestDTO:
      type: object
      required: [ personId, walletStatus, creator, modifier, currencyCode, balance, cardNumber, cardCvvNumber, cardExpirationDate, cardType ]
      properties:
        personId:
          $ref: "#/components/schemas/UuidDefinition"
        walletStatus:
          $ref: "#/components/schemas/WalletStatus"
        creator:
          type: string
          maxLength: 255
        modifier:
          type: string
          maxLength: 255
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        balance:
          $ref: "#/components/schemas/AmountDefinition"
        cardNumber:
          $ref: "#/components/schemas/CardNumberDefinition"
        cardCvvNumber:
          $ref: "#/components/schemas/CardCvvDefinition"
        cardExpirationDate:
          $ref: "#/components/schemas/CardExpirationDateDefinition"
        cardType:
          $ref: "#/components/schemas/CardType"

    TransactionRequestDTO:
      type: object
      required: [ operationType, amount, currency, timestamp, properties ]
      properties:
        operationType:
          $ref: "#/components/schemas/OperationType"
        amount:
          $ref: "#/components/schemas/AmountDefinition"
        currency:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        timestamp:
          type: long
        properties:
          type: object
          additionalProperties:
            type: string

    WalletInfoResponseDTO:
      type: object
      required: [ personId, walletId, balance, currencyCode, cardNumber, cardExpirationDate, cardType, createdAt, modifiedAt ]
      properties:
        personId:
          $ref: "#/components/schemas/UuidDefinition"
        walletId:
          $ref: "#/components/schemas/UuidDefinition"
        createdAt:
          type: string
        modifiedAt:
          type: string
        balance:
          $ref: "#/components/schemas/AmountDefinition"
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        cardNumber:
          $ref: "#/components/schemas/CardNumberDefinition"
        cardType:
          $ref: "#/components/schemas/CardType"
        cardExpirationDate:
          $ref: "#/components/schemas/CardExpirationDateDefinition"

    WalletStatus:
      enum: [ "ACTIVE", "BLOCKED" ]

    CardType:
      enum: [ "VISA", "MASTERCARD", "MIR", "AMERICAN_EXPRESS", "UNION_PAY" ]

    OperationType:
      enum: [ "DEPOSIT", "WITHDRAW", "TRANSFER" ]

    TransactionStatus:
      enum: [ "PENDING", "COMPLETED", "FAILED" ]

    UuidDefinition:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

    CurrencyCodeDefinition:
      type: string
      pattern: '^[A-Z]{3}$'
      minLength: 3
      maxLength: 3

    AmountDefinition:
      type: string
      pattern: '^([1-9][0-9]*|[0]+)\.[0-9][0-9]$'
      description: "Описание шаблона денежных средств в формате: 0.XX или Х.ХХ"

    CardCvvDefinition:
      type: string
      pattern: '^[0-9]{3}$'
      minLength: 3
      maxLength: 3

    CardNumberDefinition:
      type: string
      pattern: '^[0-9]{4}\s[0-9]{4}\s[0-9]{4}\s[0-9]{4}$'
      description: "Описание шаблона номера карты в формате: ХХХХ ХХХХ ХХХХ ХХХХ"

    CardExpirationDateDefinition:
      type: string
      pattern: '^([0][1-9]|[1][0-2])/[0-9][0-9]$'
      minLength: 5
      maxLength: 5