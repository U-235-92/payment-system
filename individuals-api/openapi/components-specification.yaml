openapi: 3.1.0

info:
  title: individuals-service-api-specification
  description: Common individuals-api-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8081
  - url: http://individuals-api:8081

paths:
  /token/refresh-token:
    post:
      security:
        - BearerAuth: []
      operationId: refreshToken
      tags:
        - Token
      summary: Handle incoming refresh token request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDTO"
              description: Represents data of refresh token
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTokenDTO"
          description: Returns updated pair of access & refresh tokens
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /transaction/status/{transactionId}:
    get:
      security:
        - BearerAuth: []
      operationId: getTransactionStatus
      tags:
        - Transaction
      summary: Get transaction status by given ID
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            $ref: "#/components/schemas/UuidDefinition"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /transaction/do-transaction:
    post:
      security:
        - BearerAuth: []
      operationId: doTransaction
      tags:
        - Transaction
      summary: Handle incoming transaction request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequestDTO"
              description: Represents data of transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidDefinition"
          description: Returns ID of requested transaction
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /user/create-user:
    post:
      security:
        - BearerAuth: []
      operationId: createUser
      tags:
        - User
      summary: Handle incoming create user request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDTO"
              description: Represents data of create user request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTokenDTO"
          description: Returns pairs of access & refresh tokens which are represented created user
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /user/login-user:
    post:
      security:
        - BearerAuth: []
      operationId: loginUser
      tags:
        - User
      summary: Handle incoming login user request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserDTO"
              description: Represents data of login user request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTokenDTO"
          description: Returns pairs of access & refresh tokens which are represented login user
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /user/update-user:
    patch:
      security:
        - BearerAuth: []
      operationId: updateUser
      tags:
        - User
      summary: Handle incoming update user request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDTO"
              description: Represents data of update user request
      responses:
        200:
          description: Returns OK status code if operation was successful
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /user/delete-user-by-keycloak-id/{keycloakId}:
    delete:
      security:
        - BearerAuth: []
      operationId: deleteUserByKeycloakId
      tags:
        - User
      summary: Delete a user by given ID
      parameters:
        - name: keycloakId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a user ID
          schema:
            $ref: "#/components/schemas/UuidDefinition"
      responses:
        200:
          description: Returns OK status code if operation was successful
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /wallet/create:
    post:
      security:
        - BearerAuth: []
      operationId: createWallet
      tags:
        - Wallet
      summary: Create a new wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletRequestDTO"
              description: Represents data for creating a new wallet
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidDefinition"
          description: Returns ID of created wallet
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  /wallet/info/{walletId}:
    get:
      security:
        - BearerAuth: []
      operationId: getWalletInfo
      tags:
        - Wallet
      summary: Get wallet info by given wallet ID
      parameters:
        - name: walletId
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            $ref: "#/components/schemas/UuidDefinition"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfoResponseDTO"
          description: Returns DTO which describes the information about wallet by given ID
        400:
          $ref: "#/components/responses/BadRequestResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /currency-rate/rate:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить курс между двумя валютами на указанную дату/время
      operationId: getRate
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "USD"
          description: Код исходной валюты (например, "USD")
        - name: to
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "EUR"
          description: Код целевой валюты (например, "EUR")
        - name: provider
          in: query
          required: false
          schema:
            type: string
          description: Идентификатор конкретного поставщика данных. Если параметр опущен, возвращается смешанное (усредненное) значение по всем доступным провайдерам.
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Дата курса валюты
          example: "2025-11-22"
      responses:
        '200':
          description: Курс найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '404':
          description: Курс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /currency-rate/currencies:
    get:
      security:
        - BearerAuth: []
      tags:
        - Rate
      summary: Получить список поддерживаемых валют
      operationId: getCurrencies
      responses:
        '200':
          description: Список валют
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyResponse'

  /currency-rate/rate-providers:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить список провайдеров курсов валют
      operationId: getRateProviders
      responses:
        '200':
          description: Провайдеры
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateProviderResponse'

  /currency-rate/currency/{code}:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить информацию по указанной валюте
      operationId: getCurrencyInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Трехбуквенный код валюты
          example: USD
      responses:
        '200':
          description: Информация по валюте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'

        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /currency-rate/provider/{code}:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить информацию по указанному поставщику курсов валют
      operationId: getRateProviderInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Код поставщика валют
          example: AMCM
      responses:
        '200':
          description: Информация по поставщику валют
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateProviderResponse'

        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

tags:
  - name: Token
    description: Describes operations with tokens
  - name: Transaction
    description: Describes operations with transactions
  - name: User
    description: Describes operations with users
  - name: Wallet
    description: Describes operations with wallets
  - name: Rate
    description: Describes operations with currencies and its rates

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDTO"
      description: Return DTO in case if parameter of request is not valid or requested data is absent
    InternalServerErrorResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDTO"
      description: Return DTO in case if something went wrong during request handling on service side

  schemas:
    UserInfoResponseDTO:
      type: object
      required: [ keycloak_user_id, email, roles, created, individual_data ]
      properties:
        keycloak_user_id:
          $ref: "#/components/schemas/UuidDefinition"
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        individual_data:
          $ref: "#/components/schemas/IndividualDataResponseDTO"

    IndividualDataResponseDTO:
      type: object
      required: [ first_name, last_name, email, phone_number, passport_number, address ]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        address:
          $ref: "#/components/schemas/AddressDTO"

    AddressDTO:
      type: object
      required: [ country, state, city, address, zip_code ]
      properties:
        country:
          $ref: "#/components/schemas/CountryDTO"
        state:
          type: string
        city:
          type: string
        address:
          type: string
        zip_code:
          type: string

    CountryDTO:
      type: object
      required: [ name, code ]
      properties:
        name:
          type: string
        code:
          type: string

    CreateUserDTO:
      type: object
      required: [ username, password, confirm_password, individual_data ]
      properties:
        keycloak_user_id:
          type: string
        username:
          type: string
        password:
          type: string
        confirm_password:
          type: string
        individual_data:
          $ref: "#/components/schemas/CreateIndividualDataDTO"

    CreateIndividualDataDTO:
      type: object
      required: [ first_name, last_name, email, phone_number, passport_number, address ]
      properties:
        keycloak_user_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        active:
          type: boolean
          default: true
        address:
          $ref: "#/components/schemas/AddressDTO"

    UpdateUserDTO:
      type: object
      required: [ keycloak_user_id, password, confirm_password, individual_data ]
      properties:
        keycloak_user_id:
          $ref: "#/components/schemas/UuidDefinition"
        password:
          type: string
        confirm_password:
          type: string
        individual_data:
          $ref: "#/components/schemas/UpdateIndividualDataDTO"

    UpdateIndividualDataDTO:
      type: object
      required: [ keycloak_user_id, first_name, last_name, phone_number, passport_number, address ]
      properties:
        keycloak_user_id:
          $ref: "#/components/schemas/UuidDefinition"
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        active:
          type: boolean
          default: true
        address:
          $ref: "#/components/schemas/AddressDTO"

    LoginUserDTO:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenDTO:
      type: object
      required: [ refresh_token ]
      properties:
        refresh_token:
          type: string

    ResponseTokenDTO:
      type: object
      required: [ keycloak_user_id, access_token, refresh_token, expires_in, token_type ]
      properties:
        keycloak_user_id:
          $ref: "#/components/schemas/UuidDefinition"
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: long
        token_type:
          type: string
          example: Bearer [token]

    UndoOperationDTO:
      type: object
      required: [ operation, payload ]
      properties:
        id:
          type: string
        operation:
          enum:
            - undo_update_person
            - undo_delete_person
        payload:
          type: object
          additionalProperties:
            type: string

    ErrorDTO:
      type: object
      required: [ http_status, message ]
      properties:
        http_status:
          type: int
        message:
          type: string

    CreateWalletRequestDTO:
      type: object
      required: [ personId, walletStatus, creator, modifier, currencyCode, balance, cardNumber, cardCvvNumber, cardExpirationDate, cardType ]
      properties:
        personId:
          $ref: "#/components/schemas/UuidDefinition"
        walletStatus:
          $ref: "#/components/schemas/WalletStatus"
        creator:
          type: string
          maxLength: 255
        modifier:
          type: string
          maxLength: 255
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        balance:
          $ref: "#/components/schemas/AmountDefinition"
        cardNumber:
          $ref: "#/components/schemas/CardNumberDefinition"
        cardCvvNumber:
          $ref: "#/components/schemas/CardCvvDefinition"
        cardExpirationDate:
          $ref: "#/components/schemas/CardExpirationDateDefinition"
        cardType:
          $ref: "#/components/schemas/CardType"

    TransactionRequestDTO:
      type: object
      required: [ operationType, amount, currency, properties ]
      properties:
        operationType:
          $ref: "#/components/schemas/OperationType"
        amount:
          $ref: "#/components/schemas/AmountDefinition"
        currency:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        currencyRateDate:
          type: string
          format: date
        rateProvider:
          type: string
          pattern: '^[A-Z]{3,10}$'
        timestamp:
          type: integer
          format: int64
        properties:
          type: object
          additionalProperties:
            type: string

    WalletInfoResponseDTO:
      type: object
      required: [ personId, walletId, balance, currencyCode, cardNumber, cardExpirationDate, cardType, createdAt, modifiedAt ]
      properties:
        personId:
          $ref: "#/components/schemas/UuidDefinition"
        walletId:
          $ref: "#/components/schemas/UuidDefinition"
        createdAt:
          type: string
        modifiedAt:
          type: string
        balance:
          $ref: "#/components/schemas/AmountDefinition"
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        cardNumber:
          $ref: "#/components/schemas/CardNumberDefinition"
        cardType:
          $ref: "#/components/schemas/CardType"
        cardExpirationDate:
          $ref: "#/components/schemas/CardExpirationDateDefinition"

    RateProviderResponse:
      type: object
      properties:
        providerCode:
          type: string
        providerName:
          type: string
        description:
          type: string
        date:
          type: string
        active:
          type: boolean

    CurrencyResponse:
      type: object
      properties:
        code:
          type: string
          description: Трёхбуквенный код валюты (ISO 4217)
        isoCode:
          type: integer
          description: Числовой ISO-код валюты
        description:
          type: string
        active:
          type: boolean
        symbol:
          type: string
          description: Символ валюты (например, $ или €)

    RateResponse:
      type: object
      properties:
        sourceCode:
          type: string
          description: Код исходной валюты (например, "USD")
        destinationCode:
          type: string
          description: Код целевой валюты (например, "EUR")
        rate:
          type: number
          description: Курс обмена sourceCode→destinationCode
        rateDate:
          type: string
          description: Время, на которое действует курс
        providerCode:
          type: string
          description: Код провайдера курса

    WalletStatus:
      enum: [ "ACTIVE", "BLOCKED" ]

    CardType:
      enum: [ "VISA", "MASTERCARD", "MIR", "AMERICAN_EXPRESS", "UNION_PAY" ]

    OperationType:
      enum: [ "DEPOSIT", "WITHDRAW", "TRANSFER" ]

    TransactionStatus:
      enum: [ "PENDING", "COMPLETED", "FAILED" ]

    UuidDefinition:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

    CurrencyCodeDefinition:
      type: string
      pattern: '^[A-Z]{3}$'
      minLength: 3
      maxLength: 3

    AmountDefinition:
      type: string
      pattern: '^([1-9][0-9]*|[0]+)\.[0-9][0-9]$'
      description: "Описание шаблона денежных средств в формате: 0.XX или Х.ХХ"

    CardCvvDefinition:
      type: string
      pattern: '^[0-9]{3}$'
      minLength: 3
      maxLength: 3

    CardNumberDefinition:
      type: string
      pattern: '^[0-9]{4}\s[0-9]{4}\s[0-9]{4}\s[0-9]{4}$'
      description: "Описание шаблона номера карты в формате: ХХХХ ХХХХ ХХХХ ХХХХ"

    CardExpirationDateDefinition:
      type: string
      pattern: '^([0][1-9]|[1][0-2])/[0-9][0-9]$'
      minLength: 5
      maxLength: 5