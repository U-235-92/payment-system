openapi: 3.1.0

info:
  title: individuals-service-api-specification
  description: Common individuals-api-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8081
  - url: http://individuals-api:8081

#############
# ENDPOINTS #
#############
paths:
  /api/v1/token/refresh-token:
    post:
      security:
        - BearerAuth: [ ]
      operationId: refreshToken
      tags:
        - Token
      summary: Handle incoming refresh token request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceTokenRequestDto"
              description: Represents data of refresh token
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceTokenResponseDto"
          description: Returns updated pair of access & refresh tokens
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/deposit/status/{transactionId}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getDepositTransactionStatus
      tags:
        - DepositTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "./transaction-service-api-specification.yaml#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/deposit/create:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createDepositTransaction
      tags:
        - DepositTransaction
      summary: Handle incoming deposit transaction request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceDepositTransactionRequestDto"
              description: Represents data of deposit transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of requested transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/transfer/status/{transactionId}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getTransferTransactionStatus
      tags:
        - TransferTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "./transaction-service-api-specification.yaml#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/transfer/create:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createTransferTransaction
      tags:
        - TransferTransaction
      summary: Handle incoming transfer transaction request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceTransferTransactionRequestDto"
              description: Represents data of transfer transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of requested transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/withdraw/status/{transactionId}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getWithdrawTransactionStatus
      tags:
        - WithdrawTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "./transaction-service-api-specification.yaml#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/withdraw/create:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createWithdrawTransaction
      tags:
        - WithdrawTransaction
      summary: Handle incoming withdraw transaction request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceWithdrawTransactionRequestDto"
              description: Represents data of withdraw transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of requested transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/create-person:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createPerson
      tags:
        - Person
      summary: Handle incoming create person request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceCreatePersonRequestDto"
              description: Represents data of create user request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceTokenResponseDto"
          description: Returns pairs of access & refresh tokens which are represented created user
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/login-person:
    post:
      security:
        - BearerAuth: [ ]
      operationId: loginPerson
      tags:
        - Person
      summary: Handle incoming login person request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceLoginPersonRequestDto"
              description: Represents data of login user request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceTokenResponseDto"
          description: Returns pairs of access & refresh tokens which are represented login user
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/update-person:
    patch:
      security:
        - BearerAuth: [ ]
      operationId: updatePerson
      tags:
        - Person
      summary: Handle incoming update person request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualsApiServiceUpdatePersonRequestDto"
              description: Represents data of update person request
      responses:
        200:
          description: Returns OK status code if operation was successful
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/delete-person/{personKeycloakId}:
    delete:
      security:
        - BearerAuth: [ ]
      operationId: deletePerson
      tags:
        - Person
      summary: Delete a person by given keycloak UUID
      parameters:
        - name: personKeycloakId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a person ID
          schema:
            type: string
            format: uuid
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/create:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createWallet
      tags:
        - Wallet
      summary: Create a new wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletRequestDto"
              description: Represents data for creating a new wallet
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of created wallet
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/info/{walletId}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getWalletInfo
      tags:
        - Wallet
      summary: Get wallet info by given wallet ID
      parameters:
        - name: walletId
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfoResponseDto"
          description: Returns DTO which describes the information about wallet by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/currency-rate/get-rate:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить курс между двумя валютами на указанную дату/время
      operationId: getRate
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "USD"
          description: Код исходной валюты (например, "USD")
        - name: to
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "EUR"
          description: Код целевой валюты (например, "EUR")
        - name: provider
          in: query
          required: false
          schema:
            type: string
          description: Идентификатор конкретного поставщика данных. Если параметр опущен, возвращается смешанное (усредненное) значение по всем доступным провайдерам.
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Дата курса валюты
          example: "2025-11-22"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
          description: Курс найден
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualsApiServiceErrorDto'
          description: Курс не найден
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualsApiServiceErrorDto'
          description: Ошибка запроса

  /api/v1/currency-rate/get-currencies:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить список поддерживаемых валют
      operationId: getCurrencies
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyResponse'
          description: Список валют

  /api/v1/currency-rate/get-rate-providers:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить список провайдеров курсов валют
      operationId: getRateProviders
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateProviderResponse'
          description: Провайдеры

  /api/v1/currency-rate/get-currency-info/{code}:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить информацию по указанной валюте
      operationId: getCurrencyInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Трехбуквенный код валюты
          example: USD
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'
          description: Информация по валюте
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualsApiServiceErrorDto'
          description: Returns ErrorDto if any 4xx client error was occurred

  /api/v1/currency-rate/get-rate-provider-info/{code}:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить информацию по указанному поставщику курсов валют
      operationId: getRateProviderInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Код поставщика валют
          example: AMCM
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateProviderResponse'
          description: Информация по поставщику валют
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualsApiServiceErrorDto'
          description: Returns ErrorDto if any 4xx client error was occurred

  /api/v1/payment/get-payment-methods/{currencyCode}/{countryCode}:
    get:
      summary: Get list of payment methods for described currency code and country code
      security:
        - basicAuth: [ ]
      operationId: getPaymentMethods
      tags:
        - Payment
      parameters:
        - name: currencyCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            minLength: 3
            maxLength: 3
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            minLength: 3
            maxLength: 3
      responses:
        200:
          description: List of payment methods for described currency code and country code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentServicePaymentMethodResponseDto"
        400:
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualsApiServiceErrorDto"
        401:
          description: Request is unauthorized or credentials are incorrect

########
# TAGS #
########
tags:
  - name: Token
    description: Describes operations with tokens
  - name: DepositTransaction
    description: Describes operations with deposit transactions
  - name: TransferTransaction
    description: Describes operations with transfer transactions
  - name: WithdrawTransaction
    description: Describes operations with withdraw transactions
  - name: Person
    description: Describes operations with persons
  - name: Wallet
    description: Describes operations with wallets
  - name: Rate
    description: Describes operations with currencies and its rates

######################
# COMPONENTS SCHEMAS #
######################
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ##########################################
    # INDIVIDUALS-API SERVICE API COMPONENTS #
    ##########################################
    IndividualsApiServiceDepositTransactionRequestDto:
      type: object
      required: [ wallet_id, payment_method_id, currency_code, amount ]
      properties:
        wallet_id:
          type: string
          format: uuid
        payment_method_id:
          type: integer
          format: int64
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          format: decimal
          x-extra-annotation: "@jakarta.validation.constraints.Positive"

    IndividualsApiServiceTransferTransactionRequestDto:
      type: object
      required: [ sender_wallet_id, recipient_wallet_id, payment_method_id, currency_code, amount ]
      properties:
        sender_wallet_id:
          type: string
          format: uuid
        recipient_wallet_id:
          type: string
          format: uuid
        payment_method_id:
          type: integer
          format: int64
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          format: decimal
          x-extra-annotation: "@jakarta.validation.constraints.Positive"

    IndividualsApiServiceWithdrawTransactionRequestDto:
      type: object
      required: [ wallet_id, payment_method_id, currency_code, amount ]
      properties:
        wallet_id:
          type: string
          format: uuid
        payment_method_id:
          type: integer
          format: int64
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          format: decimal
          x-extra-annotation: "@jakarta.validation.constraints.Positive"

    IndividualsApiServiceLoginPersonRequestDto:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          x-extra-annotations:
            - "@jakarta.validation.constraints.Email"
            - "@jakarta.validation.constraints.NotBlank"
        password:
          type: string

    IndividualsApiServicePersonInfoResponseDto:
      type: object
      required: [ person_keycloak_id, first_name, last_name, phone_number, passport_number, email,
                  country_name, country_code, state, city, address, zip_code, roles, created_at ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        first_name:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        last_name:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        phone_number:
          type: string
          pattern: '^[0-9]{11}$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        passport_number:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        email:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank @jakarta.validation.constraints.Email"
        country_name:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        country_code:
          type: string
          pattern: '^[A-Z]{3}$'
        state:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        city:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        address:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        zip_code:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    IndividualsApiServiceCreatePersonRequestDto:
      type: object
      required: [ username, password, confirm_password, first_name, last_name, email, phone_number, passport_number,
                  country_name, country_code, state, city, address, zip_code ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        username:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        confirm_password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        first_name:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        last_name:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        email:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank @jakarta.validation.constraints.Email"
        phone_number:
          type: string
          pattern: '^[0-9]{11}$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        passport_number:
          type: string
        country_name:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        country_code:
          type: string
          pattern: '^[A-Z]{3}$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        state:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        city:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        address:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        zip_code:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        active:
          type: boolean
          default: true

    IndividualsApiServiceUpdatePersonRequestDto:
      type: object
      required: [ person_keycloak_id, password, confirm_password, first_name, last_name, phone_number, passport_number,
                  country_name, country_code, state, city, address, zip_code, active ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        confirm_password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        first_name:
          type: string
          pattern: '^[A-Z][a-z]*$'
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        last_name:
          type: string
