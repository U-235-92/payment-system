openapi: 3.1.0

info:
  title: individuals-service-api-specification
  description: Common individuals-api-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8081
  - url: http://individuals-api:8081

paths:
  /api/v1/token/refresh-token:
    post:
      security:
        - BearerAuth: [ ]
      operationId: refreshToken
      tags:
        - Token
      summary: Handle incoming refresh token request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequestDto"
              description: Represents data of refresh token
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseDto"
          description: Returns updated pair of access & refresh tokens
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/{type}/init:
    post:
      security:
        - BearerAuth: [ ]
      operationId: initTransaction
      tags:
        - Transaction
      summary: It is used to get transaction conditions
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentType"
          description: Allowed type of payment [ deposit, withdrawal, transfer ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitTransactionRequestDto"
              description: Represents data of init transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitTransactionResponseDto"
          description: Returns dto that represents conditions of transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/{type}/confirm:
    post:
      security:
        - BearerAuth: [ ]
      operationId: confirmTransaction
      tags:
        - Transaction
      summary: It is used to confirm transaction
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PaymentType"
          description: Allowed type of payment [ deposit, withdrawal, transfer ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTransactionRequestDto"
              description: Represents data of init transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns UUID of confirmed transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/{id}/status:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getTransactionStatus
      tags:
        - Transaction
      summary: It is used get actual status of transaction
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Allowed UUID of transaction
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Current status of transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transactions:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getTransactions
      tags:
        - Transaction
      summary: Search for transactions by specified filters with paging
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
        - in: query
          name: walletId
          schema:
            type: string
            format: uuid
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/PaymentType"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date-time
        - in: query
          name: dateTo
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        200:
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionInfoResponseDto"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/person/create-person:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createPerson
      tags:
        - Person
      summary: Handle incoming create person request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequestDto"
              description: Represents data of create user request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseDto"
          description: Returns pairs of access & refresh tokens which are represented created user
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/login-person:
    post:
      security:
        - BearerAuth: [ ]
      operationId: loginPerson
      tags:
        - Person
      summary: Handle incoming login person request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPersonRequestDto"
              description: Represents data of login user request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseDto"
          description: Returns pairs of access & refresh tokens which are represented login user
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/update-person:
    patch:
      security:
        - BearerAuth: [ ]
      operationId: updatePerson
      tags:
        - Person
      summary: Handle incoming update person request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequestDto"
              description: Represents data of update person request
      responses:
        200:
          description: Returns OK status code if operation was successful
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/delete-person/{personKeycloakId}:
    delete:
      security:
        - BearerAuth: [ ]
      operationId: deletePerson
      tags:
        - Person
      summary: Delete a person by given keycloak UUID
      parameters:
        - name: personKeycloakId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a person ID
          schema:
            type: string
            format: uuid
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/create:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createWallet
      tags:
        - Wallet
      summary: Create a new wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletRequestDto"
              description: Represents data for creating a new wallet
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of created wallet
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/info/{walletId}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getWalletInfo
      tags:
        - Wallet
      summary: Get wallet info by given wallet ID
      parameters:
        - name: walletId
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfoResponseDto"
          description: Returns DTO which describes the information about wallet by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/currency-rate/get-rate:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить курс между двумя валютами на указанную дату/время
      operationId: getRate
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "USD"
          description: Код исходной валюты (например, "USD")
        - name: to
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
            example: "EUR"
          description: Код целевой валюты (например, "EUR")
        - name: provider
          in: query
          required: false
          schema:
            type: string
          description: Идентификатор конкретного поставщика данных. Если параметр опущен, возвращается смешанное (усредненное) значение по всем доступным провайдерам.
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Дата курса валюты
          example: "2025-11-22"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponseDto'
          description: Курс найден
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Курс не найден
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Ошибка запроса

  /api/v1/currency-rate/get-currencies:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить список поддерживаемых валют
      operationId: getCurrencies
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyResponseDto'
          description: Список валют

  /api/v1/currency-rate/get-rate-providers:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить список провайдеров курсов валют
      operationId: getRateProviders
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateProviderResponseDto'
          description: Провайдеры

  /api/v1/currency-rate/get-currency-info/{code}:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить информацию по указанной валюте
      operationId: getCurrencyInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Трехбуквенный код валюты
          example: USD
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponseDto'
          description: Информация по валюте
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Returns ErrorDto if any 4xx client error was occurred

  /api/v1/currency-rate/get-rate-provider-info/{code}:
    get:
      security:
        - BearerAuth: [ ]
      tags:
        - Rate
      summary: Получить информацию по указанному поставщику курсов валют
      operationId: getRateProviderInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Код поставщика валют
          example: AMCM
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateProviderResponseDto'
          description: Информация по поставщику валют
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Returns ErrorDto if any 4xx client error was occurred

  /api/v1/payment/get-payment-methods/{currencyCode}/{countryCode}:
    get:
      summary: Get list of payment methods for described currency code and country code
      security:
        - basicAuth: [ ]
      operationId: getPaymentMethods
      tags:
        - Payment
      parameters:
        - name: currencyCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            minLength: 3
            maxLength: 3
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            minLength: 3
            maxLength: 3
      responses:
        200:
          description: List of payment methods for described currency code and country code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethodResponseDto"
        400:
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        401:
          description: Request is unauthorized or credentials are incorrect

tags:
  - name: Token
    description: Describes operations with tokens
  - name: Transaction
    description: Describes operations with transactions
  - name: Person
    description: Describes operations with persons
  - name: Wallet
    description: Describes operations with wallets
  - name: Rate
    description: Describes operations with currencies and its rates
  - name: Payment
    description: Describes operations with payments

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenRequestDto:
      type: object
      required: [ refresh_token ]
      properties:
        refresh_token:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          description: Valid refresh JWT

    TokenResponseDto:
      type: object
      required: [ person_keycloak_id, access_token, refresh_token, expires_in, token_type ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
        token_type:
          type: string

    PaymentType:
      allOf:
        - $ref: "./transaction-service-api-specification.yaml#/components/schemas/PaymentType"

    InitTransactionRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required: [ wallet_id, amount, payment_type, currency_code ]
      properties:
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        target_wallet_id:
          type: string
          format: uuid
          description: UUID of target wallet (for transfer payment method only)
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        target_wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency (for transfer payment method only)
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    InitTransactionResponseDto:
      allOf:
        - $ref: "./transaction-service-api-specification.yaml#/components/schemas/InitTransactionResponseDto"

    ConfirmTransactionRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required: [ user_id, wallet_id, payment_method_id, amount, payment_type, currency_code ]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of user
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        target_wallet_id:
          type: string
          format: uuid
          description: UUID of target wallet (for transfer payment method only)
        payment_method_id:
          type: integer
          format: int64
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        target_wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency (for transfer payment method only)
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    TransactionStatus:
      allOf:
        - $ref: "./transaction-service-api-specification.yaml#/components/schemas/TransactionStatus"

    TransactionInfoResponseDto:
      allOf:
        - $ref: "./transaction-service-api-specification.yaml#/components/schemas/TransactionInfoResponseDto"

    CreatePersonRequestDto:
      allOf:
        - $ref: "./person-service-api-specification.yaml#/components/schemas/CreatePersonRequestDto"
      properties:
        username:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        confirm_password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"

    UpdatePersonRequestDto:
      allOf:
        - $ref: "./person-service-api-specification.yaml#/components/schemas/UpdatePersonRequestDto"
      properties:
        password:
          type: string
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"

    PersonInfoResponseDto:
      allOf:
        - $ref: "./person-service-api-specification.yaml#/components/schemas/PersonInfoResponseDto"
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    LoginPersonRequestDto:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          x-extra-annotations:
            - "@jakarta.validation.constraints.Email"
            - "@jakarta.validation.constraints.NotBlank"
        password:
          type: string

    CreateWalletRequestDto:
      allOf:
        - $ref: "./wallet-service-api-specification.yaml#/components/schemas/CreateWalletRequestDto"

    WalletInfoResponseDto:
      allOf:
        - $ref: "./wallet-service-api-specification.yaml#/components/schemas/WalletInfoResponseDto"

    RateResponseDto:
      allOf:
        - $ref: "./currency-rate-service-api-specification.yaml#/components/schemas/RateResponseDto"

    CurrencyResponseDto:
      allOf:
        - $ref: "./currency-rate-service-api-specification.yaml#/components/schemas/CurrencyResponseDto"

    RateProviderResponseDto:
      allOf:
        - $ref: "./currency-rate-service-api-specification.yaml#/components/schemas/RateProviderResponseDto"

    PaymentMethodResponseDto:
      allOf:
        - $ref: "./payment-service-api-specification.yaml#/components/schemas/PaymentMethodResponseDto"

    ErrorDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.NoArgsConstructor @lombok.AllArgsConstructor"
      properties:
        message:
          type: string
        trace_id:
          type: string