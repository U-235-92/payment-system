openapi: 3.1.0

info:
  title: person-service-api-specification
  description: Common person-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8082
  - url: http://person-service:8082


paths:
  /api/v1/person/create-person:
    post:
      security:
        - BearerAuth: []
      operationId: createPerson
      tags:
        - Person
      summary: Create a new person
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonServiceCreatePersonRequestDto"
              description: Represents data for creating a new person
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns an UUID of created person
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/delete-person/{personKeycloakId}:
    delete:
      security:
        - BearerAuth: [ ]
      operationId: deletePerson
      tags:
        - Person
      summary: Delete a person by given UUID
      parameters:
        - name: personKeycloakId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a person ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/person/undo-delete-person:
    post:
      security:
        - BearerAuth: []
      operationId: undoDeletePerson
      tags:
        - Person
      summary: Undo delete of a person
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonServiceUndoDeletePersonRequestDto"
              description: Represents data of undo operation
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred
  /api/v1/person/update-person:
    patch:
      security:
        - BearerAuth: []
      operationId: updatePerson
      tags:
        - Person
      summary: Update of a person
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonServiceUpdatePersonRequestDto"
              description: Represents data for updating a person
      responses:
        200:
          description: Returns OK status code if operation was successful
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred
  /api/v1/person/undo-update-person:
    post:
      security:
        - BearerAuth: []
      operationId: undoUpdatePerson
      tags:
        - Person
      summary: Undo update of a person
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonServiceUndoUpdatePersonRequestDto"
              description: Represents data of undo operation
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred
  /api/v1/person/get-person-info/{personKeycloakId}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getPersonInfo
      tags:
        - Person
      summary: Get person info by given ID
      parameters:
        - name: personKeycloakId
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a person ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServicePersonInfoResponseDto"
          description: Returns current info of person by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

tags:
  - name: Person
    description: Describes operations with persons

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PersonServicePersonInfoResponseDto:
      type: object
      required: [ first_name, last_name, email, phone_number, passport_number, country, address ]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        country:
          $ref: "#/components/schemas/PersonServiceCountryDto"
        address:
          $ref: "#/components/schemas/PersonServiceAddressDto"

    PersonServiceCreatePersonRequestDto:
      type: object
      required: [ first_name, last_name, email, phone_number, passport_number, country, address ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        passport_number:
          type: string
        active:
          type: boolean
          default: true
        country:
          $ref: "#/components/schemas/PersonServiceCountryDto"
        address:
          $ref: "#/components/schemas/PersonServiceAddressDto"

    PersonServiceUpdatePersonRequestDto:
      type: object
      required: [ person_keycloak_id ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        passport_number:
          type: string
        active:
          type: boolean
          default: true
        country:
          $ref: "#/components/schemas/PersonServiceCountryDto"
        address:
          $ref: "#/components/schemas/PersonServiceAddressDto"

    PersonServiceAddressDto:
      type: object
      required: [ ]
      properties:
        state:
          type: string
        city:
          type: string
        address:
          type: string
        zip_code:
          type: string

    PersonServiceCountryDto:
      type: object
      required: [ ]
      properties:
        name:
          type: string
        code:
          type: string
          pattern: '^[A-Z]{3}$'

    PersonServiceUndoUpdatePersonRequestDto:
      type: object
      required: [ person_keycloak_id ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        description:
          type: string

    PersonServiceUndoDeletePersonRequestDto:
      type: object
      required: [ person_keycloak_id ]
      properties:
        person_keycloak_id:
          type: string
          format: uuid
        description:
          type: string

    PersonServiceErrorDto:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
        trace_id:
          type: string
        http_status:
          type: integer
          format: int32

    UndoOperationStatus:
      enum: [ "FAILED", "COMPLETED" ]

    PersonServiceOperation:
      enum: [ "GET_PERSON_INFO", "CREATE_PERSON", "UPDATE_PERSON", "DELETE_PERSON", "UNDO_UPDATE_PERSON", "UNDO_DELETE_PERSON" ]