openapi: 3.1.0

info:
  title: transaction-service-api-specification
  description: Common transaction-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8084
  - url: http://transaction-service:8084

#############
# ENDPOINTS #
#############
paths:
  /api/v1/transaction/send:
    post:
      security:
        - BearerAuth: []
      operationId: sendTransactionRequest
      tags:
        - Transaction
      summary: Handle incoming transaction request
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequestDto"
              description: Represents data of transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidDefinition"
          description: Returns ID of requested transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred
  /api/v1/transaction/status/{id}:
    get:
      security:
        - BearerAuth: []
      operationId: getTransactionStatus
      tags:
        - Transaction
      summary: Get transaction status by given ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            $ref: "#/components/schemas/UuidDefinition"
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

########
# TAGS #
########
tags:
  - name: Transaction
    description: Describes operations with transactions

######################
# COMPONENTS SCHEMAS #
######################
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
######################################
# TRANSACTION SERVICE API COMPONENTS #
######################################
    TransactionRequestDto:
      type: object
      required: [ operationType, amount, currency, properties ]
      properties:
        operationType:
          $ref: "#/components/schemas/OperationType"
        amount:
          $ref: "#/components/schemas/AmountDefinition"
        currency:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        currencyRateDate:
          type: string
          format: date-time
        rateProvider:
          type: string
          pattern: '^[A-Z]{3,10}$'
        timestamp:
          type: integer
          format: int64
        properties:
          type: object
          additionalProperties:
            type: string

    ErrorDto:
      type: object
      required: [ http_status, message ]
      properties:
        http_status:
          type: integer
          format: int32
        message:
          type: string

    OperationType:
      enum: [ "DEPOSIT", "WITHDRAW", "TRANSFER" ]

    TransactionStatus:
      enum: [ "PENDING", "COMPLETED", "FAILED" ]

    UuidDefinition:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

#################################
# WALLET SERVICE API COMPONENTS #
#################################
    AmountDefinition:
      $ref: "./wallet-service-api-specification.yaml#/components/schemas/AmountDefinition"

    CurrencyCodeDefinition:
      $ref: "./wallet-service-api-specification.yaml#/components/schemas/CurrencyCodeDefinition"