server:
  port: ${SERVICE_PORT}
spring:
  application:
    name: ${SERVICE_NAME}
  profiles:
    active:
      - dev
  main:
    web-application-type: reactive
management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${SERVICE_NAME}
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health
application:
  individuals-api:
    endpoints:
      create-user: /api/user/create-user
      login-user: /api/user/login-user
      update-user: /api/user/update-user
      delete-user-by-keycloak-id: /api/user/delete-user-by-keycloak-id/
      get-user-info: /api/user/get-user-info
      refresh-token: /api/user/refresh-token
  person-service:
    name: person-service
    uri: http://localhost:8082
    endpoints:
      create-person: ${PERSON_SERVICE_CREATE_PERSON_ENDPOINT}
      delete-person-by-keycloak-id: ${PERSON_SERVICE_DELETE_PERSON_ENDPOINT}
      undo-delete-person-by-keycloak-id: ${PERSON_SERVICE_UNDO_DELETE_PERSON_ENDPOINT}
      update-person: ${PERSON_SERVICE_UPDATE_PERSON_ENDPOINT}
      undo-update-person: ${PERSON_SERVICE_UNDO_UPDATE_PERSON_ENDPOINT}
      get-person-info-by-keycloak-id: ${PERSON_SERVICE_GET_PERSON_INFO_ENDPOINT}
  wallet-service:
    name: wallet-service
    uri: http://localhost:8083
    endpoints:
      create-wallet: ${WALLET_SERVICE_CREATE_WALLET}
      get-wallet-info: ${WALLET_SERVICE_GET_WALLET_INFO}
  transaction-service:
    name: transaction-service
    uri: http://localhost:8084
    endpoints:
      get-transaction-status: ${TRANSACTION_SERVICE_GET_TRANSACTION_STATUS}
      send-transaction-request: ${TRANSACTION_SERVICE_SEND_TRANSACTION_REQUEST}
