      confirm-transaction-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100
      get-transaction-status-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100
      get-transactions-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-payment-methods-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      login-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      create-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      update-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      delete-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-person-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

application:
  keycloak-service:
    name: keycloak-service
    realm: payment-system
    uri: http://localhost:8080
    admin-uri: http://localhost:8080/admin/realms/payment-system/users
    endpoints:
      token: /realms/payment-system/protocol/openid-connect/token
      admin: /admin/realms/payment-system/users

  person-service:
    name: person-service
    uri: http://localhost:8082

  transaction-service:
    name: transaction-service
    uri: http://localhost:8083

  wallet-service:
    name: wallet-service
    uri: http://localhost:8084

  currency-rate-service:
    name: currency-rate-service
    uri: http://localhost:8085

  payment-service:
    name: payment-service
    uri: http://localhost:8087