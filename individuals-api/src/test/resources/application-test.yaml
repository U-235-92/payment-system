resilience4j:
  ratelimiter:
    instances:
      create-deposit-transaction-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1
      get-deposit-transaction-status-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      create-withdraw-transaction-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1
      get-withdraw-transaction-status-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      create-transfer-transaction-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1
      get-transfer-transaction-status-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      create-wallet-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1
      get-wallet-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      get-payment-methods-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      login-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      create-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      update-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      delete-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      get-person-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

