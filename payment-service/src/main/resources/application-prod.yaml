logging:
  level:
    root: info
server:
  port: ${SERVICE_PORT}
spring:
  application:
    name: ${SERVICE_NAME}
  profiles:
    active:
      - ${PROFILE}
  flyway:
    enabled: true
    baseline-version: 1
    baseline-on-migrate: true
    default-schema: public
    create-schemas: true
    locations: 'classpath:db/migration'
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  jpa:
    show-sql: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_JWT_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWT_JWK_SET_URI}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URI}
  metrics:
    tags:
      application: ${SERVICE_NAME}
service:
  payment-provider-service:
    name: ${PAYMENT_PROVIDER_SERVICE_NAME}
    uri: ${PAYMENT_PROVIDER_SERVICE_URL}
  payment-service:
    merchant-id: ${MERCHANT_ID}
    merchant-secret: ${MERCHANT_SECRET}
