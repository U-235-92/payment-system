logging:
  level:
    root: info

server:
  port: ${SERVICE_PORT}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URI}

spring:
  profiles:
    active:
      - ${PROFILE}

  kafka:
    bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}

  flyway:
    enabled: true
    baseline-version: 1
    baseline-on-migrate: true
    default-schema: public
    create-schemas: true
    locations: 'classpath:db/migration'

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  jpa:
    show-sql: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_JWT_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWT_JWK_SET_URI}

app:
  service:
    fake-payment-provider-service:
      uri: ${FAKE_PAYMENT_PROVIDER_SERVICE_BASE_URI}