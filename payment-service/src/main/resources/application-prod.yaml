logging:
  level:
    root: info

server:
  port: ${SERVICE_PORT}

spring:
  application:
    name: ${SERVICE_NAME}

  profiles:
    active:
      - ${PROFILE}

  flyway:
    enabled: true
    baseline-version: 1
    baseline-on-migrate: true
    default-schema: public
    create-schemas: true
    locations: 'classpath:db/migration'

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  jpa:
    show-sql: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI}
            token-uri: ${OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI}
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET}
            admin-id: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_ADMIN_ID}
            admin-secret: ${OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_ADMIN_SECRET}
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_JWT_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWT_JWK_SET_URI}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URI}

  metrics:
    tags:
      application: ${SERVICE_NAME}

app:
  service:
    keycloak:
      uri: ${KEYCLOAK_SERVICE_BASE_URI}

    fake-payment-provider-service:
      uri: ${FAKE_PAYMENT_PROVIDER_SERVICE_BASE_URI}

    individuals-api:
      uri: ${INDIVIDUALS_API_SERVICE_BASE_URI}