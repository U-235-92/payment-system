logging:
  level:
    root: info

server:
  port: 8087

spring:
  application:
    name: payment-service

  profiles:
    active:
      - dev

  task:
    scheduling:
      pool:
        size: 10

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/payment-system
            token-uri: http://localhost:8080/realms/payment-system/protocol/openid-connect/token
        registration:
          keycloak:
            client-id: payment-service
            client-secret: H4fnQQwfECigQWB6UWgzI6255oYZjYgb
            admin-id: payment-system-admin-cli
            admin-secret: RGybolPwVl7FMtZDyZCn6owhkY3ewtam
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/payment-system
          jwk-set-uri: http://localhost:8080/realms/payment-system/protocol/openid-connect/certs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces # OTEL collector URI
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: payment-service
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health

resilience4j:
  ratelimiter:
    instances:
      create-payment-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-payment-methods-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

  retry:
    instances:
      handle-pending-payment-retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        fail-after-max-attempts: true

      handle-processing-payment-retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        fail-after-max-attempts: true

      handle-complete-payment-retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        fail-after-max-attempts: true

      handle-fail-payment-retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        fail-after-max-attempts: true

app:
  service:
    fake-payment-provider-service:
      uri: http://localhost:8086

    payment-service:
      merchant-id: payment-service
      merchant-secret: payment-service-secret
      schedulers:
        schedule-processing-payment: 5
        schedule-pending-payment: 5

  kafka:
    consumer:
      group:
        payment_service_consumer: payment_service_consumer
    topics:
      payment_status_update_response: payment_status_update_response