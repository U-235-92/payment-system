server:
  port: 8087

logging:
  level:
    root: info

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces # OTEL collector URI

  otlp:
    metrics:
      export:
        enabled: false

  metrics:
    tags:
      application: payment-service

  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health

spring:
  application:
    name: payment-service

  profiles:
    active:
      - dev

  task:
    scheduling:
      pool:
        size: 10

  kafka:
    bootstrapServers:
      - localhost:29092
      - localhost:39092
      - localhost:49092
    listener:
      ack-mode: MANUAL
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: latest
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "aq.project.kafka.events"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/payment-system
          jwk-set-uri: http://localhost:8080/realms/payment-system/protocol/openid-connect/certs

  cloud:
    circuitbreaker:
      resilience4j:
        enabled: false

resilience4j:
  ratelimiter:
    instances:
      create-payment-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-payment-methods-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

  retry:
    instances:
      handle-pending-payout-retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        fail-after-max-attempts: true

      handle-pending-transaction-retry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        fail-after-max-attempts: true

app:
  service:
    fake-payment-provider-service:
      uri: http://localhost:8086

    payment-service:
      merchant-id: payment-service
      merchant-secret: secret
      schedulers:
        schedule-pending-payment: 5

  kafka:
    topics:
      payment-status-update-response: payment_status_update_response