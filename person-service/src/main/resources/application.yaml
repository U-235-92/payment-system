server:
  port: 8082
spring:
  application:
    name: person-service
  profiles:
    active:
      - dev
management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: person-service
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health

