server:
  port: 8082
spring:
  application:
    name: person-service
  profiles:
    active:
      - dev
management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: person-service
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health
resilience4j:
  ratelimiter:
    instances:
      create-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      update-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      undo-update-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      delete-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      undo-delete-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100

      get-person-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 100