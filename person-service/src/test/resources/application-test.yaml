spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations:
      - classpath:test-migration
    create-schemas: true
    schemas:
      - person
      - public
      - service
  jpa:
    show-sql: true
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
logging:
  level:
    org:
      hibernate: info
resilience4j:
  ratelimiter:
    instances:
      create-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      update-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      undo-update-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      delete-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      undo-delete-person-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1

      get-person-info-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1