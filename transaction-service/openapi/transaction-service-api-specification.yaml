########
# TAGS #
########
tags:
  - name: DepositTransaction
    description: Describes operations with deposit transactions
  - name: TransferTransaction
    description: Describes operations with transfer transactions
  - name: WithdrawTransaction
    description: Describes operations with withdraw transactions

######################
# COMPONENTS SCHEMAS #
######################
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
######################################
# TRANSACTION SERVICE API COMPONENTS #
######################################
    TransactionServiceDepositTransactionRequestDto:
      type: object
      required: [ walletId, traceId, amount, currencyCode, conversionRate, notificationUrl ]
      properties:
        walletId:
          type: string
          format: uuid
        traceId:
          type: string
        amount:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        conversionRate:
          type: number
          format: decimal
        notificationUrl:
          type: string

    TransactionServiceTransferTransactionRequestDto:
      type: object
      required: [ senderWalletId, recipientWalletId, traceId, amount, currencyCode, senderConversionRate, recipientConversionRate, notificationUrl ]
      properties:
        senderWalletId:
          type: string
          format: uuid
        recipientWalletId:
          type: string
          format: uuid
        traceId:
          type: string
        amount:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        senderConversionRate:
          type: number
          format: decimal
        recipientConversionRate:
          type: number
          format: decimal
        notificationUrl:
          type: string

    TransactionServiceWithdrawTransactionRequestDto:
      type: object
      required: [ walletId, traceId, amount, currencyCode, conversionRate, notificationUrl ]
      properties:
        walletId:
          type: string
          format: uuid
        traceId:
          type: string
        amount:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        conversionRate:
          type: number
          format: decimal
        notificationUrl:
          type: string

    ErrorDto:
      type: object
      required: [ http_status, message ]
      properties:
        http_status:
          type: integer
          format: int32
        message:
          type: string

    TransactionStatus:
      enum: [ "PENDING", "COMPLETED", "FAILED", "CANCELED" ]

    CurrencyCodeDefinition:
      type: string
      pattern: '^[A-Z]{3}$'
      minLength: 3
      maxLength: 3