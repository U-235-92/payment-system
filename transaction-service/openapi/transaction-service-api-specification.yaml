openapi: 3.1.0

info:
  title: transaction-service-api-specification
  description: Common transaction-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8084
  - url: http://transaction-service:8084

#############
# ENDPOINTS #
#############
paths:
  /api/v1/transaction/deposit/create:
    post:
      security:
        - BearerAuth: []
      operationId: createDepositTransaction
      tags:
        - DepositTransaction
      summary: Handle incoming deposit transaction request
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionServiceDepositTransactionRequestDto"
              description: Represents data of transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of requested transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/deposit/status/{id}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getDepositTransactionStatus
      tags:
        - DepositTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/transfer/create:
