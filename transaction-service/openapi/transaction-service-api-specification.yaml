openapi: 3.1.0

info:
  title: transaction-service-api-specification
  description: Common transaction-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8083
  - url: http://transaction-service:8083

paths:
  /api/v1/transaction/init:
    post:
      security:
        - BearerAuth: [ ]
      operationId: initTransaction
      tags:
        - Transaction
      summary: It is used to get transaction conditions
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitTransactionRequestDto"
              description: Represents data of init transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitTransactionResponseDto"
          description: Returns dto that represents conditions of transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/confirm:
    post:
      security:
        - BearerAuth: [ ]
      operationId: confirmTransaction
      tags:
        - Transaction
      summary: It is used to confirm transaction
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTransactionRequestDto"
              description: Represents data of init transaction request
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns UUID of confirmed transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/{id}/status:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getTransactionStatus
      tags:
        - Transaction
      summary: It is used get actual status of transaction
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Allowed UUID of transaction
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Current status of transaction
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transactions:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getTransactions
      tags:
        - Transaction
      summary: Search for transactions by specified filters with paging
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
        - in: query
          name: walletId
          schema:
            type: string
            format: uuid
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/PaymentType"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date-time
        - in: query
          name: dateTo
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            format: int32
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        200:
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionInfoResponseDto"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

  /api/v1/transaction/{id}/fail:
    post:
      security:
        - BearerAuth: [ ]
      operationId: failTransaction
      tags:
        - Transaction
      summary: Mark transaction as failed by given ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented a valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      responses:
        200:
          description: Returns OK 200 response in case successful handle of operation
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if was received incorrect request
        401:
          description: Response in case if unauthorized request was received
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Response in case if error was occurred on service side

tags:
  - name: Transaction
    description: Describes operations with transactions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InitTransactionRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.AllArgsConstructor"
      required: [ wallet_id, amount, wallet_conversion_rate, payment_type, currency_code ]
      properties:
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        target_wallet_id:
          type: string
          format: uuid
          description: UUID of target wallet (for transfer payment method only)
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        target_wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency (for transfer payment method only)
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    InitTransactionResponseDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.AllArgsConstructor"
      required: [ wallet_id, available, payment_type ]
      properties:
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        fee:
          type: number
          format: decimal
          minimum: 0.00
          description: Fee of operation
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        total_amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Total amount of transaction (total_amount = amount + fee)
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        available:
          type: boolean
          description: Availability of operation
        description:
          type: string
          description: Description of operation
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    ConfirmTransactionRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.AllArgsConstructor"
      required: [ user_id, wallet_id, amount, wallet_conversion_rate, payment_type, currency_code ]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of user
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        target_wallet_id:
          type: string
          format: uuid
          description: UUID of target wallet (for transfer payment method only)
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        target_wallet_conversion_rate:
          type: number
          format: decimal
          description: Conversion rate for currency (for transfer payment method only)
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    TransactionInfoResponseDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.AllArgsConstructor"
      required: [ transaction_id, user_id, wallet_id, wallet_amount, payment_type, currency_code ]
      properties:
        transaction_id:
          type: string
          format: uuid
          description: UUID of transaction
        user_id:
          type: string
          format: uuid
          description: UUID of user
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        target_wallet_id:
          type: string
          format: uuid
          description: UUID of target wallet (for transfer payment method only)
        wallet_amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        target_wallet_amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction (for transfer payment method only)
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    PaymentType:
      enum: [ DEPOSIT, WITHDRAWAL, TRANSFER ]
      description: Allowed payment operations

    TransactionStatus:
      enum: [ PENDING, COMPLETED, FAILED ]
      description: Allowed transaction statuses

    ErrorDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.NoArgsConstructor @lombok.AllArgsConstructor"
      properties:
        message:
          type: string
        trace_id:
          type: string