# DATA SOURCES
dataSources:
  datasource_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:5465/transactions_db
    username: root
    password: root
  datasource_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:5475/transactions_db
    username: root
    password: root

# SHARDING RULES
rules:
  - !SHARDING
    tables:
#      TRANSACTIONS table
      transactions:
        actualDataNodes: datasource_${0..1}.transactions
        databaseStrategy:
          standard:
            shardingColumn: wallet_id
            shardingAlgorithmName: pk_shard_alg_by_hash_wallet_id
        keyGenerateStrategy:
          column: id
          keyGeneratorName: uuid_generator
#       UTILS
    keyGenerators:
      uuid_generator:
        type: UUID
    shardingAlgorithms:
      pk_shard_alg_by_hash_wallet_id:
        type: INLINE
        props:
          algorithm-expression: datasource_${Math.abs(id.hashCode()) % 2}
    bindingTables:
      - transactions
# TRANSACTIONS
transaction:
  defaultType: LOCAL
  providerType: Atomikos