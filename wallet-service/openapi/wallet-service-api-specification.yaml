openapi: 3.1.0

info:
  title: wallet-service-api-specification
  description: Common wallet-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8084
  - url: http://wallet-service:8084

paths:
  /api/v1/wallet/create:
    post:
      security:
        - BearerAuth: [ ]
      operationId: createWallet
      tags:
        - Wallet
      summary: Create a new wallet
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletRequestDto"
              description: Represents data for creating a new wallet
      responses:
        201:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns UUID of created wallet
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/info/{id}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getWalletInfo
      tags:
        - Wallet
      summary: Get wallet info by given wallet ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfoResponseDto"
          description: Returns DTO which describes the information about wallet by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/currency/{id}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getWalletCurrency
      tags:
        - Wallet
      summary: Get wallet currency by given wallet ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
          description: Returns valid currency code
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/deposit:
    post:
      security:
        - BearerAuth: [ ]
      operationId: depositWallet
      tags:
        - Wallet
      summary: Deposit wallet
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositWalletRequestDto"
              description: Represents data for deposit sufficient on target wallet
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns wallet UUID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/withdrawal:
    post:
      security:
        - BearerAuth: [ ]
      operationId: withdrawalWallet
      tags:
        - Wallet
      summary: Withdrawal wallet
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalWalletRequestDto"
              description: Represents data for withdrawal sufficient from target wallet
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns wallet UUID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/transfer:
    post:
      security:
        - BearerAuth: [ ]
      operationId: transferWallet
      tags:
        - Wallet
      summary: Transfer wallet
      parameters:
        - name: x-trace-id
          in: header
          required: false
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: OAuth 2.0 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferWalletRequestDto"
              description: Represents data for transfer sufficient from one wallet to another wallet
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
          description: Returns array of transfer wallets [ source_wallet_id, target_wallet_id ]
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletServiceErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

tags:
  - name: Wallet
    description: Describes operations with wallets

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateWalletRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder @lombok.AllArgsConstructor"
      required: [ user_id, name, currency_code, user_type, creator, modifier, wallet_status ]
      properties:
        user_id:
          type: string
          format: uuid
          description: User UUID value
        name:
          type: string
          description: Wallet name
        balance:
          type: number
          format: decimal
          default: 0.00
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
          description: Wallet balance
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code
        user_type:
          $ref: "#/components/schemas/WalletUserType"
          description: Wallet user type
        creator:
          type: string
          description: Creator of the wallet
        modifier:
          type: string
          description: Modifier of the wallet
        wallet_status:
          $ref: "#/components/schemas/WalletStatus"
          description: Current status of wallet

    WalletInfoResponseDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required: [ wallet_id, user_id, name, balance, currency_code, user_type, creator, modifier, wallet_status, created_at, modified_at ]
      properties:
        wallet_id:
          type: string
          format: uuid
          description: Wallet UUID value
        user_id:
          type: string
          format: uuid
          description: User UUID value
        name:
          type: string
          description: Wallet name
        balance:
          type: number
          format: decimal
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
          description: Wallet balance
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code
        user_type:
          $ref: "#/components/schemas/WalletUserType"
          description: Wallet user type
        creator:
          type: string
          description: Creator of the wallet
        modifier:
          type: string
          description: Modifier of the wallet
        wallet_status:
          $ref: "#/components/schemas/WalletStatus"
          description: Current status of wallet
        created_at:
          type: string
          format: date-time
          description: Wallet creation time
        modified_at:
          type: string
          format: date-time
          description: Wallet modification time

    DepositWalletRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required: [ wallet_id, amount, currency_code ]
      properties:
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    WithdrawalWalletRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required: [ wallet_id, amount, currency_code ]
      properties:
        wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    TransferWalletRequestDto:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required: [ source_wallet_id, target_wallet_id, amount, currency_code ]
      properties:
        source_wallet_id:
          type: string
          format: uuid
          description: UUID of source wallet
        target_wallet_id:
          type: string
          format: uuid
          description: UUID of target wallet
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Amount of transaction
          x-extra-annotation: "@jakarta.validation.constraints.Positive"
        currency_code:
          type: string
          pattern: '[A-Z]{3}'
          description: Valid currency code

    WalletStatus:
      enum: [ active, blocked ]
      description: Allowed wallet statuses

    WalletUserType:
      enum: [ business, personal ]
      description: Allowed wallet user type

    WalletServiceErrorDto:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
        trace_id:
          type: string
        http_status:
          type: integer
          format: int32