openapi: 3.1.0

info:
  title: wallet-service-api-specification
  description: Common wallet-service API specification. It describes all REST endpoints and DTO objects
  version: 1.0.0

servers:
  - url: http://localhost:8083
  - url: http://wallet-service:8083

paths:
  /api/v1/wallet/create:
    post:
      security:
        - BearerAuth: []
      operationId: createWallet
      tags:
        - Wallet
      summary: Create a new wallet
      parameters:
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletRequestDto"
              description: Represents data for creating a new wallet
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
                format: uuid
          description: Returns ID of created wallet
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/info/{id}:
    get:
      security:
        - BearerAuth: []
      operationId: getWalletInfo
      tags:
        - Wallet
      summary: Get wallet info by given wallet ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfoResponseDto"
          description: Returns DTO which describes the information about wallet by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/wallet/currency/{id}:
    get:
      security:
        - BearerAuth: []
      operationId: getWalletCurrency
      tags:
        - Wallet
      summary: Get wallet currency by given wallet ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a wallet ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                type: string
          description: Returns valid currency code
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/deposit/status/{id}:
    get:
      security:
        - BearerAuth: []
      operationId: getDepositTransactionStatus
      tags:
        - DepositTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/withdraw/status/{id}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getWithdrawTransactionStatus
      tags:
        - WithdrawTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

  /api/v1/transaction/transfer/status/{id}:
    get:
      security:
        - BearerAuth: [ ]
      operationId: getTransferTransactionStatus
      tags:
        - TransferTransaction
      summary: Get transaction status by given ID
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter is represented an valid UUID that describes a transaction ID
          schema:
            type: string
            format: uuid
        - name: x-trace-id
          in: header
          required: true
          schema:
            type: string
          description: Identifier of open telemetry trace
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: JWT доступа к ресурсу
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
          description: Returns current status of transaction by given ID
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 4xx client error was occurred
        401:
          description: Error occurred if received unauthorized request
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Returns ErrorDto if any 5xx server error was occurred

tags:
  - name: Wallet
    description: Describes operations with wallets
  - name: DepositTransaction
    description: Describes operations with deposit transactions
  - name: WithdrawTransaction
    description: Describes operations with withdraw transactions
  - name: TransferTransaction
    description: Describes operations with transfer transactions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
      description: Return DTO in case if parameter of request is not valid or requested data is absent
    InternalServerErrorResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
      description: Return DTO in case if something went wrong during request handling on service side

  schemas:
    CreateWalletRequestDto:
      type: object
      required: [ personId, walletStatus, creator, modifier, currencyCode, balance, cardNumber, cardCvvNumber, cardExpirationDate, cardType ]
      properties:
        personId:
          type: string
          format: uuid
        walletStatus:
          $ref: "#/components/schemas/WalletStatus"
        creator:
          type: string
          maxLength: 255
        modifier:
          type: string
          maxLength: 255
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        balance:
          type: number
          format: decimal
        cardNumber:
          $ref: "#/components/schemas/CardNumberDefinition"
        cardCvvNumber:
          $ref: "#/components/schemas/CardCvvDefinition"
        cardExpirationDate:
          $ref: "#/components/schemas/CardExpirationDateDefinition"
        cardType:
          $ref: "#/components/schemas/CardType"

    WalletInfoResponseDto:
      type: object
      required: [ personId, walletId, balance, currencyCode, cardNumber, cardExpirationDate, cardType, createdAt, modifiedAt ]
      properties:
        personId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        balance:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        cardNumber:
          $ref: "#/components/schemas/CardNumberDefinition"
        cardType:
          $ref: "#/components/schemas/CardType"
        cardExpirationDate:
          $ref: "#/components/schemas/CardExpirationDateDefinition"

    DepositTransactionRequestWalletServiceDto:
      type: object
      required: [ transactionId, walletId, amount, currencyCode, transactionStatus, timestamp, traceId, conversionRate ]
      properties:
        transactionId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        conversionRate:
          type: number
          format: decimal

    TransferTransactionRequestWalletServiceDto:
      type: object
      required: [ transactionId, senderWalletId, recipientWalletId, amount, currencyCode, transactionStatus, timestamp, traceId, senderConversionRate, recipientConversionRate ]
      properties:
        transactionId:
          type: string
          format: uuid
        senderWalletId:
          type: string
          format: uuid
        recipientWalletId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        senderConversionRate:
          type: number
          format: decimal
        recipientConversionRate:
          type: number
          format: decimal

    WithdrawTransactionRequestWalletServiceDto:
      type: object
      required: [ transactionId, walletId, amount, currencyCode, transactionStatus, timestamp, traceId, conversionRate ]
      properties:
        transactionId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currencyCode:
          $ref: "#/components/schemas/CurrencyCodeDefinition"
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        conversionRate:
          type: number
          format: decimal

    DepositTransactionResponseWalletServiceDto:
      type: object
      required: [ transactionId, walletId, transactionStatus, timestamp ]
      properties:
        transactionId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        timestamp:
          type: string
          format: date-time

    TransferTransactionResponseWalletServiceDto:
      type: object
      required: [ transactionId, senderWalletId, recipientWalletId, transactionStatus, timestamp ]
      properties:
        transactionId:
          type: string
          format: uuid
        senderWalletId:
          type: string
          format: uuid
        recipientWalletId:
          type: string
          format: uuid
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        timestamp:
          type: string
          format: date-time

    WithdrawTransactionResponseWalletServiceDto:
      type: object
      required: [ transactionId, walletId, transactionStatus, timestamp ]
      properties:
        transactionId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        timestamp:
          type: string
          format: date-time

    ErrorDto:
      type: object
      required: [ http_status, message ]
      properties:
        http_status:
          type: integer
          format: int32
        message:
          type: string

    WalletStatus:
      enum: [ "ACTIVE", "BLOCKED" ]

    CardType:
      enum: [ "VISA", "MASTERCARD", "MIR", "AMERICAN_EXPRESS", "UNION_PAY" ]

    TransactionStatus:
      enum: [ "PENDING", "COMPLETED", "FAILED" ]

    CurrencyCodeDefinition:
      type: string
      pattern: '^[A-Z]{3}$'
      minLength: 3
      maxLength: 3

    CardCvvDefinition:
      type: string
      pattern: '^[0-9]{3}$'
      minLength: 3
      maxLength: 3

    CardNumberDefinition:
      type: string
      pattern: '^[0-9]{4}\s[0-9]{4}\s[0-9]{4}\s[0-9]{4}$'
      description: "Описание шаблона номера карты в формате: ХХХХ ХХХХ ХХХХ ХХХХ"

    CardExpirationDateDefinition:
      type: string
      pattern: '^([0][1-9]|[1][0-2])/[0-9][0-9]$'
      minLength: 5
      maxLength: 5