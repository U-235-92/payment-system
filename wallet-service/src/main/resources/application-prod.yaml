server:
  port: ${SERVICE_PORT}

logging:
  level:
    root: info

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URI}
  metrics:
    tags:
      application: ${SERVICE_NAME}

spring:
  application:
    name: ${SERVICE_NAME}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}

  flyway:
    driver-class-name:
    default-schema: public
    baseline-version: ${FLYWAY_DB_BASELINE_VERSION}
    baseline-on-migrate: true
    create-schemas: true
    locations: ${FLYWAY_MIGRATION_SCRIPT_PATH}
    clean-disabled: false

  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:prod-sharding.yaml?placeholder-type=environment

  jpa:
    show-sql: false
    generate-ddl: false
    database-platform: ${DB_DIALECT}
    hibernate:
      ddl-auto: validate

app:
  datasource:
    - ${SHARD0_DB_URL},${SHARD0_DB_USERNAME},${SHARD0_DB_PASSWORD}
    - ${SHARD1_DB_URL},${SHARD1_DB_USERNAME},${SHARD1_DB_PASSWORD}