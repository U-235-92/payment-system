logging:
  level:
    root: info
    org.apache.shardingsphere: info
    org.springframework.security: info
server:
  port: 8083
spring:
  application:
    name: wallet-service
  profiles:
    active:
      - dev-shard
  kafka:
    listener:
      ack-mode: RECORD
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: latest
      group-id: wallet-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "aq.project.messages"
  flyway:
    enabled: false
management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: wallet-service
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health
otel:
  instrumentation:
    annotations:
      enabled: true
service:
  kafka:
    topics:
      wallet_operation_response:
        name: wallet_operation_response
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      wallet_operation_response_dlt:
        name: wallet_operation_response_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      wallet_operation_response_exceptions:
        name: wallet_operation_response_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      wallet_operation_request:
        name: wallet_operation_request
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      wallet_operation_request_dlt:
        name: wallet_operation_request_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      wallet_operation_request_exceptions:
        name: wallet_operation_request_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
    partitions:
      deposit:
        name: deposit
      withdraw:
        name: withdraw
      transfer:
        name: transfer
application:
  services:
    wallet-service:
      name: wallet-service
      audit:
        db: wallets_db
        schema: public
        table: revinfo
        column: rev