logging:
  level:
    root: info
    org.apache.shardingsphere: info
    org.springframework.security: info
server:
  port: 8083
spring:
  application:
    name: wallet-service
  profiles:
    active:
      - dev-shard
  task:
    scheduling:
      pool:
        size: 3
  kafka:
    listener:
      ack-mode: RECORD
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: latest
      group-id: wallet-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "aq.project.messages"
  flyway:
    enabled: false
management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: wallet-service
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health
otel:
  instrumentation:
    annotations:
      enabled: true
service:
  kafka:
    topics:

      deposit_transaction_response:
        name: deposit_transaction_response
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      deposit_transaction_response_dlt:
        name: deposit_transaction_response_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      deposit_transaction_response_exceptions:
        name: deposit_transaction_response_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2

      withdraw_transaction_response:
        name: withdraw_transaction_response
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      withdraw_transaction_response_dlt:
        name: withdraw_transaction_response_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      withdraw_transaction_response_exceptions:
        name: withdraw_transaction_response_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2

      transfer_transaction_response:
        name: transfer_transaction_response
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      transfer_transaction_response_dlt:
        name: transfer_transaction_response_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      transfer_transaction_response_exceptions:
        name: transfer_transaction_response_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2

      deposit_transaction_request:
        name: deposit_transaction_request
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      deposit_transaction_request_dlt:
        name: deposit_transaction_request_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      deposit_transaction_request_exceptions:
        name: deposit_transaction_request_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2

      withdraw_transaction_request:
        name: withdraw_transaction_request
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      withdraw_transaction_request_dlt:
        name: withdraw_transaction_request_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      withdraw_transaction_request_exceptions:
        name: withdraw_transaction_request_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2

      transfer_transaction_request:
        name: transfer_transaction_request
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      transfer_transaction_request_dlt:
        name: transfer_transaction_request_dlt
        partitions: 3
        replicas: 3
        min_insync_replicas: 2
      transfer_transaction_request_exceptions:
        name: transfer_transaction_request_exceptions
        partitions: 3
        replicas: 3
        min_insync_replicas: 2

    backoff:
      max-attempts: 3
      wait-duration: 1500
      multiplier: 2
application:
  services:
    wallet-service:
      name: wallet-service
      audit:
        db: wallets_db
        schema: public
        table: revinfo
        column: rev