spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    create-schemas: true

  jpa:
    show-sql: true
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

logging:
  level:
    org:
      hibernate: info

resilience4j:
  ratelimiter:
    instances:
      confirm-operation-rate-limiter:
        limit-refresh-period: 1s
        limit-for-period: 1